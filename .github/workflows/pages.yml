# Tests, then app/ on GitHub Pages (Settings → Pages → Source: GitHub Actions). The instruments are committed in
# app/instruments/ (scripts/build_instruments.sh), so neither the submodules nor a toolchain are needed here.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: precache.json and sw.js are current
        run: |
          node scripts/gen_precache.mjs
          git diff --exit-code app/precache.json app/sw.js || (echo "run: node scripts/gen_precache.mjs" && exit 1)

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
