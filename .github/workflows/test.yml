# The tests and the user flows on every push. The site itself is the gh-pages branch, written by scripts/pages.sh
# (GitHub Pages serves it). The instruments are committed in app/instruments/ (scripts/build_instruments.sh), so neither
# the submodules nor a toolchain are needed here.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: precache.json and sw.js are current
        run: |
          node scripts/gen_precache.mjs
          git diff --exit-code app/precache.json app/sw.js || (echo "run: node scripts/gen_precache.mjs" && exit 1)

  user-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-flow-failures
          path: test-results/e2e
